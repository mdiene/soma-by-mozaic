# Déploiement statique sur Render. Les clés se saisissent dans le tableau de bord
# Render (Environment) : elles ne sont jamais écrites ici.
services:
  - type: web
    name: soma-by-mozaic
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://ndzjirmrfdeheuljjvxb.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
